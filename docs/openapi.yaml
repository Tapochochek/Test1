openapi: 3.1.0
info:
  title: ОренКод — API цифровой платформы ФСП
  version: 0.1.0
  description: Стартовый API-прототип. Ролевая авторизация и часть бизнес-сценариев пока не реализованы.
servers:
  - url: http://localhost:8081
    description: Локальный API при запуске через Docker Compose
paths:
  /api/health:
    get:
      summary: Проверить состояние API и PostgreSQL
      responses:
        '200':
          description: API и БД доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: boolean, example: true }
                  service: { type: string, example: orenkod-api }
        '503': { description: База данных недоступна }
  /api/dashboard:
    get:
      summary: Получить данные главной панели
      responses:
        '200':
          description: Сводные показатели, ближайшие соревнования и лидеры рейтинга
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      athletes: { type: integer }
                      competitions: { type: integer }
                      applications: { type: integer }
                      judges: { type: integer }
                  competitions_total: { type: integer }
                  competitions: { type: array, items: { $ref: '#/components/schemas/Competition' } }
                  top_athletes: { type: array, items: { $ref: '#/components/schemas/RatingEntry' } }
  /api/competitions:
    get:
      summary: Получить список соревнований
      responses:
        '200':
          description: Коллекция соревнований
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Competition' } }
    post:
      summary: Создать черновик соревнования
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetitionCreate' }
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '400': { description: Ошибка валидации входных данных }
        '409': { description: Соревнование с таким названием уже существует }
  /api/athletes:
    get:
      summary: Получить реестр спортсменов
      responses:
        '200':
          description: Коллекция участников
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Athlete' } }
  /api/rating:
    get:
      summary: Получить рейтинг спортсменов
      parameters:
        - in: query
          name: discipline
          required: false
          schema: { type: string }
          description: Фильтр по точному названию дисциплины
      responses:
        '200':
          description: Рейтинг по демонстрационной сумме очков
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RatingEntry' } }
                  calculation: { type: string }
  /api/team:
    get:
      summary: Получить текущий демонстрационный состав сборной
      responses:
        '200':
          description: Топ-5 рейтинга (не официальный принцип отбора)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RatingEntry' } }
                  basis: { type: string }
  /api/notifications:
    get:
      summary: Получить демонстрационные системные уведомления
      responses:
        '200':
          description: Коллекция уведомлений
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
  /api/integrations/max/status:
    get:
      summary: Проверить конфигурацию MAX
      responses:
        '200':
          description: Наличие переменных конфигурации без раскрытия секретов
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  default_chat_configured: { type: boolean }
                  webhook_secret_configured: { type: boolean }
                  webhook_path: { type: string }
  /api/integrations/max/webhook:
    post:
      summary: Принимать события MAX
      description: При заданном MAX_WEBHOOK_SECRET проверяется заголовок X-Max-Bot-Api-Secret. В production нужен публичный HTTPS endpoint.
      parameters:
        - in: header
          name: X-Max-Bot-Api-Secret
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Событие принято }
        '400': { description: Некорректное событие }
        '401': { description: Неверный секрет webhook }
components:
  schemas:
    Competition:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        discipline: { type: string }
        competition_type: { type: string }
        age_group: { type: string }
        starts_at: { type: string, format: date-time }
        location: { type: string }
        status: { type: string }
        participants: { type: integer }
    CompetitionCreate:
      type: object
      required: [title, discipline, starts_at]
      properties:
        title: { type: string, minLength: 1, example: Кубок Оренбургской области }
        discipline: { type: string, example: Программирование }
        competition_type: { type: string, example: Региональный }
        age_group: { type: string, example: Юниоры }
        starts_at: { type: string, example: '2026-11-21T10:00:00+05:00' }
        location: { type: string, example: Оренбург }
    Athlete:
      type: object
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        organization: { type: string }
        discipline: { type: string }
        age_group: { type: string }
        points: { type: integer }
        coach_name: { type: string }
        status: { type: string }
    RatingEntry:
      type: object
      properties:
        rank: { type: integer }
        athlete: { type: string }
        organization: { type: string }
        discipline: { type: string }
        age_group: { type: string }
        points: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [warning, info, success] }
        title: { type: string }
        message: { type: string }
        when: { type: string }
